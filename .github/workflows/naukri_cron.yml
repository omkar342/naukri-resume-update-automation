name: Naukri Resume Auto-Updater

on:
  schedule:
    # Runs every 2 hours during Indian business hours (03:30 to 13:30 UTC = 9:00 AM to 7:00 PM IST)
    - cron: '30 3,5,7,9,11,13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/google-chrome.gpg
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt Resume
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in master_resume.enc -out master_resume.pdf -k "${{ secrets.RESUME_PASSPHRASE }}"

      - name: Run Naukri Resume Updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RESUME_PATH: ./master_resume.pdf
          RESUME_RENAME_MODE: date_time
          HEADLESS: true
          KEEP_RENAMED_COPY: false
          LOGIN_TIMEOUT: 60
        run: |
          python3 naukri_updater.py --headless
